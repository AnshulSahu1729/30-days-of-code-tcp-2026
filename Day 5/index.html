<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tic Tac Toe</title>


  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="app">
    <h1>
      Tic-Tac-Toe
    </h1>

    <div class="status" id="status">Player X's Turn</div>

    <div class="board" id="board">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>

    <button id="restart">
      Restart
      <img src="restart_svg.svg" alt="restart">
    </button>
  </div>


  <script src="index.js"></script>
</body>
</html>
